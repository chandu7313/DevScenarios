services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devscenarios-app
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      - REDIS_URL=redis://redis:6379
      - HOSTNAME=0.0.0.0
    restart: always
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: devscenarios-redis
    ports:
      - "6380:6379"
    restart: always
